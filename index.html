<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>
<body>

    <!-- START OF NAVIGATION BAR-->
    <nav class="navbar" style="background-color: #e3f2fd;" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">HOME</a>
        </div>
    </nav>
    <!-- END OF NAVIGATION BAR-->


    <div class="container-sm">
        <form class="row g-3">

            <!--START OF BTN (once clicked, it will be vanished from front-end) -->
            <section>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button id="pick-word" class="btn btn-primary btn-lg" type="button">RANDOM WORD HERE</button>
                    
                </div>
            </section>
            <!--END OF BTN-->

            <!-- START OF QUESTION -->
            <section id="question-screen" hidden>
                <!-- START OF SLCTD WORD (will show the random word) -->
                <h1 class="display-6">Which words are synonyms for</h1>
                <h1 id="question-word" class="display-5"></h1>
                <p class="h5" id="instruction">Instruction: Select only 2 words that are synonyms of the word above.</p>
                <!-- END OF SLCTD WORD -->

                <!-- START OF WORD OPTIONS CONTAINER (will show the synonyms option) -->
                <div class="container text-center">
                    <div class="row gx-5">
                        <div class="col">
                            <div class="d-grid gap-2" id="word-options">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- END OF WORD OPTIONS CONTAINER -->


                <!-- START SUBMIT ANSWER BUTTON -->
                <div>
                    <div class="d-grid gap-2 col-6 mx-auto">
                        <button id="submit-answer" type="button" class="btn btn-primary btn-lg">SUBMIT</button>
                    </div>
                </div>
                <!-- END SUBMIT ANSWER BUTTON -->
            </section>
            <!-- END OF QUESTION -->

            <!-- START OF CORRECT ANSWER -->
            <section>
                <!--container for result of selection-->
                <div id="answer-feedback">
                </div>
                <button id="continue-button" type="button" hidden>
                    Continue
                </button>
            </section>
            <!-- END OF CORRECT ANSWER -->

            <!-- START OF MAKING SENTENCE -->
            <section id="sentence-screen" hidden>
                <h2>Sentence Challenge</h2>
                <p id="sentence-instruction"></p>

                <label id="sentence-label-one" for="sentence-one"></label>
                <textarea
                    id="sentence-one"
                    placeholder=""
                ></textarea>

                <label id="sentence-label-two" for="sentence-two"></label>
                <textarea
                    id="sentence-two"
                    placeholder=""
                ></textarea>
                <p>Check my word usage and grammar</p>
                <button id="continue-sentence-button" type="button" hidden>
                    Continue
                </button>

            </section>
            <!-- END OF MAKING SENTENCE -->

            <!-- START OF CHECKING SENTENCES -->
            <section>
                

            </section>

            <!-- END OF CHECKING SENTENCES-->


        </form>
    </div>
    
    <script src="./functions-js/gameStartv2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
